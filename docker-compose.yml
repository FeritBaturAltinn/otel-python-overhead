services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      MODE: ${MODE:-none}
      SPANS: ${SPANS:-10}
      OTEL_SERVICE_NAME: overhead-demo
    depends_on:
      - collector

  collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    ports:
      - "16686:16686"
  
  k6:
    image: grafana/k6:0.54.0
    profiles: ["load"]
    volumes:
      - ./load.js:/scripts/load.js:ro
      - ./results:/results
    environment:
      TARGET: http://app:8000/work